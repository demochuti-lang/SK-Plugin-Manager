# SK Plugin Manager — Mac + Windows installer builds
#
# Triggers:
#   - push of a tag like v1.0.0  → builds both installers automatically
#   - manual "Run workflow" button in the Actions tab (workflow_dispatch)
#
# Output: the .dmg (macOS) and -setup.exe (Windows NSIS) are uploaded as
# workflow artifacts on every run — download them from the run's page.
#
# NOTE: builds are currently UNSIGNED (see commented env block below).
# Signing/notarization comes later and needs paid certificates.

name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: sk-plugin-manager-macos
            bundle-glob: "src-tauri/target/release/bundle/dmg/*.dmg"
          - os: windows-latest
            artifact-name: sk-plugin-manager-windows
            bundle-glob: "src-tauri/target/release/bundle/nsis/*-setup.exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        # --- Signing (comes later — leave commented until release) ---
        # env:
        #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        #   TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.bundle-glob }}
          if-no-files-found: error
