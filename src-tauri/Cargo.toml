[package]
name = "sk-plugin-manager"
version = "1.0.0"
description = "SK Plugin Manager - install, detect and manage Adobe CEP extensions and scripts"
authors = ["Md. Shakib Hossain"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "io-util", "fs"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
zip = "2"
quick-xml = "0.38"
# Google Drive: manual OAuth2 + Drive REST calls. rustls (no OpenSSL) so the
# Linux CI build stays headache-free; default-features off keeps it minimal.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "form"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
